<body>
    <h1>Conway's Game of Life</h1>
    <div class="controls">
        <input type="range" id="slider" min="1" max="500" value="100">
        <b><p>Speed: 1 tick per <span id="speed"></span>ms</p></b>
        <button id="sound">🔊 Sound is on</button>
        <button id="toggle">Start</button>
        <button id="clear"">Clear</button>
    </div>
    <canvas id="c"></canvas>

    <style>
    body {
        background: CornflowerBlue;
        color: MidnightBlue;
        font-family: sans-serif;
        margin: 0px;
    }
    h1 {
        text-align: center;
        margin: 0px;
    }
    .controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin: 0;
    }
    #c {
        display: block;
        border: 1px solid White;
        margin: auto;
    }
    </style>

    <script>
    const controls = document.querySelector(".controls");
    const title = document.querySelector("h1");
    let isClicked = false;
    title.onclick = () => {
        isClicked = !isClicked;
        title.textContent = isClicked ? "LOL you clicked it" : "Conway's Game of Life";
    };

    const sound = document.getElementById("sound");
    let isSoundOn = true;
    sound.onclick = () => {
        isSoundOn = !isSoundOn;
        sound.textContent = isSoundOn ? "🔊 Sound is on" : "🔇 Sound is off";
    };

    const c = document.getElementById('c');
    const ctx = c.getContext("2d");
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    const size = 10;
    let rows, cols, grid = [];
    let lastOuterWidth, lastOuterHeight;
    let isRunning = false, interval = null;
    let isMouseDown = false, lastCell = null, isDeadAlive = true;

    function draw() {
        ctx.fillStyle = "#2E2E2E";
        ctx.fillRect(0, 0, c.width, c.height);

        ctx.strokeStyle = "White";
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let j = 1; j < rows; j++) {
            ctx.moveTo(0, j*(size + 1) - 1 + 0.5);
            ctx.lineTo(c.width, j*(size + 1) - 1 + 0.5);
        }
        for (let i = 1; i < cols; i++) {
            ctx.moveTo(i*(size + 1) - 1 + 0.5, 0);
            ctx.lineTo(i*(size + 1) - 1 + 0.5, c.height);
        }
        ctx.stroke();

        for (let i = 0; i < rows; i++) {
            for (let j = 0; j < cols; j++) {
                if (grid[i][j]) {
                    ctx.fillStyle = "DodgerBlue";
                    ctx.fillRect(j*(size + 1), i*(size + 1), size, size);
                }
            }
        }
    }

    const clear = document.getElementById("clear");
    clear.onclick = () => {
        for (let i = 0; i < rows; i++) {
            grid[i] = [];
            for (let j = 0; j < cols; j++) {
                grid[i][j] = false;
            }
        }
        draw();
    };

    onresize = () => {
        if (lastOuterWidth === outerWidth && lastOuterHeight === outerHeight) {
            return;
        }
        lastOuterWidth = outerWidth;
        lastOuterHeight = outerHeight;

        rows = Math.floor((innerHeight - title.offsetHeight - controls.offsetHeight - 2 + 1)/(size + 1));
        cols = Math.floor((innerWidth - 2 + 1)/(size + 1));

        c.width = cols*size + cols - 1;
        c.height = rows*size + rows - 1;

        for (let i = 0; i < rows; i++) {
            grid[i] = [];
            for (let j = 0; j < cols; j++) {
                grid[i][j] = false;
            }
        }

        draw();
    };
    onresize();

    function countNeighbors(row, col) {
        let count = 0;
        for (let i = row - 1; i <= row + 1; i++) {
            for (let j = col - 1; j <= col + 1; j++) {
                if (i === row && j === col) continue;
                if (i >= 0 && i < rows && j >= 0 && j < cols) {
                    if (grid[i][j]) count++;
                }
            }
        }
        return count;
    }

    function updateGrid() {
        let newGrid = [];
        for (let i = 0; i < rows; i++) {
            newGrid[i] = [];
            for (let j = 0; j < cols; j++) {
                const neighbors = countNeighbors(i, j);
                if (grid[i][j]) {
                    newGrid[i][j] = neighbors === 2 || neighbors === 3;
                }
                else {
                    newGrid[i][j] = neighbors === 3;
                }
            }
        }
        grid = newGrid;
    }

    function beep() {
        if (!isSoundOn) return;
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = 333;

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.05);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
    }
    
    function getCell(event) {
        const canvas = c.getBoundingClientRect();

        const mouseX = event.clientX - canvas.left;
        const mouseY = event.clientY - canvas.top;

        const mouseRow = Math.floor(mouseY / (size + 1));
        const mouseCol = Math.floor(mouseX / (size + 1));

        if (mouseRow >= 0 && mouseRow < rows && mouseCol >= 0 && mouseCol < cols) {
            return {row: mouseRow, col: mouseCol};
        }
        return null;
    }

    c.onmousedown = (event) => {
        isMouseDown = true;
        const cell = getCell(event);
        if (cell) {
            isDeadAlive = !grid[cell.row][cell.col];
            grid[cell.row][cell.col] = isDeadAlive;
            lastCell = cell;
            draw();
        }
    };

    onmousemove = (event) => {
        if (!isMouseDown) return;

        const cell = getCell(event);
        if (cell && cell !== lastCell) {
            grid[cell.row][cell.col] = isDeadAlive;
            lastCell = cell;
            draw();
        }
    };

    onmouseup = () => {
        isMouseDown = false;
        lastCell = null;
    };

    function gameLoop() {
        isRunning = !isRunning;
        toggle.textContent = isRunning ? "Stop" : "Start";
        if (isRunning) {
            interval = setInterval(() => {
                updateGrid();
                draw();
                beep();
            }, slider.value);
        }
        else {
            clearInterval(interval);
        }
    }

    const slider = document.getElementById("slider");
    const speed = document.getElementById("speed");
    speed.textContent = slider.value;
    slider.oninput = () => {
        speed.textContent = slider.value;
        if (isRunning) {
            clearInterval(interval);
            interval = setInterval(() => {
                updateGrid();
                draw();
                beep();
            }, slider.value);
        }
    };

    onkeydown = (event) => {
        if (event.key === " ") {
            event.preventDefault();
            if (event.repeat) return;
            gameLoop();
        }
    };

    const toggle = document.getElementById("toggle");
    toggle.onclick = () => {
        gameLoop();
    };
    </script>
</body>
