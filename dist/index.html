<body><h1>Conway's Game of Life</h1><canvas id="c"></canvas><style>body{background:CornflowerBlue;color:MidnightBlue;font-family:sans-serif;margin:0px}h1{text-align:center;margin:0px}#c{display:block;border:1px solid White;margin:auto}</style><script>const e=document.querySelector("h1");let t=!1;e.onclick=()=>{t=!t,e.textContent=t?"LOL you clicked it":"Conway's Game of Life"};const o=document.getElementById("c"),i=o.getContext("2d");let l,h,n,r,f=[];onresize=()=>{if(n!==outerWidth||r!==outerHeight){n=outerWidth,r=outerHeight,l=Math.floor((innerWidth-2)/11),h=Math.floor((innerHeight-e.offsetHeight-2)/11),o.width=10*l+l-1,o.height=10*h+h-1;for(let e=0;e<h;e++){f[e]=[];for(let t=0;t<l;t++)f[e][t]=!1}!function(){i.fillStyle="#2E2E2E",i.fillRect(0,0,o.width,o.height),i.strokeStyle="White",i.lineWidth=1,i.beginPath();for(let e=0;e<l;e++)i.moveTo(11*e,0),i.lineTo(11*e,o.height);for(let e=0;e<h;e++)i.moveTo(0,11*e),i.lineTo(o.width,11*e);i.stroke();for(let e=0;e<h;e++)for(let t=0;t<l;t++)f[e][t]&&(i.fillStyle="DodgerBlue",i.fillRect(11*t,11*e,10,10))}()}},onresize();</script></body>
